{% extends "base.html" %}
{% block title %}Sign Up — Atelier{% endblock %}

{% block content %}
<style>
  .auth-page {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 80px 24px 120px;
  }

  .auth-title {
    font-family: var(--font-serif);
    font-size: clamp(1.75rem, 4vw, 2.5rem);
    font-weight: var(--weight-light);
    letter-spacing: var(--tracking-wide);
    text-transform: uppercase;
    color: var(--color-text);
    margin-bottom: 56px;
    line-height: 1;
  }

  .auth-form {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    gap: 36px;
  }

  /* ---- Field ----------------------------------------------- */
  .field {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .field__label {
    font-family: var(--font-sans);
    font-size: 0.625rem;
    font-weight: var(--weight-normal);
    letter-spacing: var(--tracking-widest);
    text-transform: uppercase;
    color: var(--color-muted);
  }

  .field__input {
    width: 100%;
    border: none;
    border-bottom: 1px solid var(--color-text);
    border-radius: 0;
    padding: 8px 0;
    background: transparent;
    font-family: var(--font-sans);
    font-size: 0.875rem;
    font-weight: var(--weight-light);
    color: var(--color-text);
    transition: border-color var(--transition-base);
    -webkit-appearance: none;
    appearance: none;
  }

  .field__input::placeholder {
    color: transparent;
  }

  .field__input:focus {
    outline: none;
    border-bottom-color: var(--color-text);
  }

  /* ---- Submit --------------------------------------------- */
  .auth-submit {
    margin-top: 8px;
    align-self: flex-start;
    font-family: var(--font-sans);
    font-size: 0.6875rem;
    font-weight: var(--weight-normal);
    letter-spacing: var(--tracking-widest);
    text-transform: uppercase;
    color: var(--color-text);
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    border-bottom: 1px solid transparent;
    transition: border-color var(--transition-base);
  }

  .auth-submit:hover {
    border-bottom-color: var(--color-text);
  }

  /* ---- Footer link ----------------------------------------- */
  .auth-footer {
    margin-top: 48px;
    font-family: var(--font-sans);
    font-size: 0.6875rem;
    letter-spacing: 0.04em;
    color: var(--color-muted);
  }

  .auth-footer a {
    color: var(--color-text);
    border-bottom: 1px solid transparent;
    transition: border-color var(--transition-base);
  }

  .auth-footer a:hover {
    border-bottom-color: var(--color-text);
    text-decoration: none;
  }
</style>

<div class="auth-page">
  <h1 class="auth-title">Create Account</h1>

  <form class="auth-form" method="POST">
    <div class="field">
      <label class="field__label" for="email">Email</label>
      <input
        class="field__input"
        type="email"
        id="email"
        name="email"
        placeholder="email"
        autocomplete="email"
      />
    </div>

    <div class="field">
      <label class="field__label" for="firstname">First Name</label>
      <input
        class="field__input"
        type="text"
        id="firstname"
        name="firstname"
        placeholder="firstname"
        autocomplete="given-name"
      />
    </div>

    <div class="field">
      <label class="field__label" for="password1">Password</label>
      <input
        class="field__input"
        type="password"
        id="password1"
        name="password1"
        placeholder="password"
        autocomplete="new-password"
      />
    </div>

    <div class="field">
      <label class="field__label" for="password2">Confirm Password</label>
      <input
        class="field__input"
        type="password"
        id="password2"
        name="password2"
        placeholder="password2"
        autocomplete="new-password"
      />
    </div>

    <button type="submit" class="auth-submit">Create Account</button>
  </form>

  <p class="auth-footer">
    Already a member? <a href="/login">Login</a>
  </p>
</div>
{% endblock %}
